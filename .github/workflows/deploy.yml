name: Deploy to AWS
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init & Apply
        id: terraform
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve
          echo "instance_ip=$(terraform output -raw server_public_ip)" >> $GITHUB_ENV

      # This is the NEW part that makes it a Docker project
      - name: Build and Push Docker Image
        run: |
          docker build -t my-devops-app .
          # In a real project, you'd push to Docker Hub here. 
          # For now, we will verify the build works in the pipeline.

      - name: Deploy App to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.instance_ip }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo docker run -d -p 80:80 nginx