name: Deploy to AWS
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init & Apply
        id: terraform
        run: |
          set -euo pipefail
          cd terraform
          terraform init
          terraform apply -auto-approve
          # Capture the IP reliably, strip CRs and take the first line
          IP=$(terraform output -raw server_public_ip | tr -d '\r' | head -n1)
          # Ensure a terminating newline is written to GITHUB_ENV to avoid concat issues
          printf "instance_ip=%s\n" "$IP" >> $GITHUB_ENV
          echo "terraform: server_public_ip=$IP"

      # This is the NEW part that makes it a Docker project
      - name: Deploy Docker Container
        run: |
          # Note: In a full project, you would SSH into the server here.
          # For this stage, just knowing the IP is a huge win!
          echo "Server is ready at ${{ env.instance_ip }}"

      - name: Verify SSH private key secret
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Fail early and safely if the SSH secret is missing or empty
          if [ -z "${SSH_PRIVATE_KEY}" ]; then
            echo "ERROR: SSH_PRIVATE_KEY secret is empty" >&2
            exit 1
          fi
          echo "SSH_PRIVATE_KEY length: ${#SSH_PRIVATE_KEY}"

      - name: Deploy App to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ env.instance_ip }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Pull latest image, remove any old container, and start a named container
            sudo docker pull nginx:latest
            sudo docker rm -f web || true
            sudo docker run -d --name web -p 80:80 nginx:latest
            sudo docker ps -a
            # Quick health check on the instance
            curl -I http://127.0.0.1 || true

      - name: Show instance IP (debug)
        run: echo "instance_ip=${{ env.instance_ip }}"

      - name: Verify Website is Reachable
        run: |
          sleep 5
          if curl -sSf http://${{ env.instance_ip }} >/dev/null; then
            echo "Website reachable"
          else
            echo "Website NOT reachable" >&2
            curl -v http://${{ env.instance_ip }} || true
            exit 1
          fi